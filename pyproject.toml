[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptkeep"
version = "0.2.0"
description = "Prompts as first-class objects: versioned templates, SQLite lineage tracking, and OpenAI run tracking."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranav", email = "pranav2278@gmail.com" }]
keywords = ["prompt", "prompts", "llm", "openai", "prompt-engineering", "versioning", "tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "peewee>=3.17",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]

[project.scripts]
promptkeep = "promptkeep.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/promptkeep"]

[tool.hatch.build.targets.sdist]
# Ship what a downstream builder needs and nothing that only makes sense in
# the repository (planning docs, CI config, demo scripts, the lockfile).
only-include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["promptkeep"]

[tool.coverage.report]
# cli.py is the `serve` launcher: it starts uvicorn, which no unit test should.
omit = ["*/promptkeep/cli.py"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
